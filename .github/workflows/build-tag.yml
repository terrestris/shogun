name: Build and Deploy for Tag
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      nexus_user:
          required: true
      nexus_pass:
          required: true
      docker_registry_user:
        required: true
      docker_registry_password:
        required: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.tag }}

      - name: Detect Java version from pom.xml
        id: detect-java
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          fallback = "25"
          pom_path = "pom.xml"

          def find_with_ns(root, path):
              ns = {"m": "http://maven.apache.org/POM/4.0.0"}
              return root.find(path, ns)

          def first_property_text(root, paths):
              for path in paths:
                  elem = find_with_ns(root, path)
                  if elem is not None and elem.text:
                      value = elem.text.strip()
                      if value:
                          return value
              return None

          java_version = None

          try:
              tree = ET.parse(pom_path)
              root = tree.getroot()

              # Prefer explicit java.version; fallback to compiler release/source.
              java_version = first_property_text(root, [
                  "./m:properties/m:java.version",
                  "./m:properties/m:maven.compiler.release",
                  "./m:properties/m:maven.compiler.source",
              ])
          except Exception:
              java_version = None

          if not java_version:
              java_version = fallback

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as fh:
              fh.write(f"java-version={java_version}\n")

          print(f"Using Java version: {java_version}")
          PY

      - name: Set up Java ${{ steps.detect-java.outputs.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '${{ steps.detect-java.outputs.java-version }}'
          architecture: x64

      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Create maven settings.xml with credentials
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: |
            [
              { "id": "hub.terrestris.de", "username": "${{ secrets.DOCKER_REGISTRY_USER }}", "password": "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" },
              { "id": "nexus.terrestris.de", "username": "${{ secrets.nexus_user }}", "password": "${{ secrets.nexus_pass }}" },
              { "id": "terrestris-nexus", "username": "${{ secrets.nexus_user }}", "password": "${{ secrets.nexus_pass }}" },
              { "id": "terrestris-nexus-snapshots", "username": "${{ secrets.nexus_user }}", "password": "${{ secrets.nexus_pass }}" }
            ]

      - name: Ensure latest Docker image registry
        shell: bash
        run: |
          sed -i \
            's#docker-public\.terrestris\.de/shogun/#hub\.terrestris\.de/shogun/#' \
            pom.xml

      - name: Install dependencies
        run: mvn compile --batch-mode

      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Deploy dependencies and docker release
        run: mvn deploy --batch-mode
